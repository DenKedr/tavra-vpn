name: Rust and Flutter checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tavra_test
          POSTGRES_PASSWORD: throwaway-ci-only
          POSTGRES_DB: tavra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tavra_test -d tavra_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CARGO_BUILD_JOBS: '2'
      TAVRA_TEST_DATABASE_URL: postgresql://tavra_test:throwaway-ci-only@127.0.0.1:5432/tavra_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy && rustup default 1.99.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  flutter:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/tavra
      - run: flutter analyze
        working-directory: apps/tavra
      - run: flutter test
        working-directory: apps/tavra
